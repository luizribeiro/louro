---
name: Homebrew

"on":
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump:
    uses: luizribeiro/homebrew-tap/.github/workflows/bump-formula.yml@main
    with:
      formula: louro
    secrets:
      tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
