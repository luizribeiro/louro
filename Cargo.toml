[package]
name = "louro"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luizribeiro/louro"
description = "Let any coding agent act as an IRC bot"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
