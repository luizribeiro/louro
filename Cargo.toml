[package]
name = "louro"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luizribeiro/louro"
description = "Let any coding agent act as an IRC bot"

[dependencies]
humantime = "2.4.0"
# cargo-deny counts a git dependency without a version as a wildcard.
papo = { version = "=0.0.0", git = "https://github.com/luizribeiro/papo", rev = "d56b4601d66fb3082d410b432a010ec828fbaa8c" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
tokio = { version = "1.53.3", features = ["net", "io-util", "macros", "rt", "sync", "time"] }
rpassword = "7.5.4"
toml = "1.1.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"
